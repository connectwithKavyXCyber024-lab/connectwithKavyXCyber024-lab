<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kavy Soni, Python, React.js, Full-Stack Developer. A cabin glowing in a pine forest at dusk." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a1f"/>
      <stop offset="0.6" stop-color="#16342f"/>
      <stop offset="1" stop-color="#2b5a47"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6f1d8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6f1d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc66d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc66d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c5b5" stop-opacity="0"/>
      <stop offset="1" stop-color="#a8c5b5" stop-opacity="0.28"/>
    </linearGradient>
    <symbol id="pine" viewBox="0 0 60 120">
      <polygon points="30,0 48,38 38,38 54,70 41,70 58,104 2,104 19,70 6,70 22,38 12,38"/>
      <rect x="26" y="104" width="8" height="16"/>
    </symbol>
  </defs>

  <style>
    .name { font: 700 56px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #eef5ef; letter-spacing: 1px; }
    .role { font: 400 22px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #bcd6c8; }
    .code { font: 400 15px Consolas, "Courier New", monospace; fill: #7fb08f; }
    .star { fill: #f6f1d8; animation: twinkle 4s ease-in-out infinite; }
    .s2 { animation-delay: 1.2s; }
    .s3 { animation-delay: 2.4s; }
    .win { animation: pulse 5s ease-in-out infinite; }
    .smoke { fill: #cfe0d6; opacity: 0; animation: rise 7s ease-out infinite; }
    .sm2 { animation-delay: 2.3s; }
    .sm3 { animation-delay: 4.6s; }
    @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
    @keyframes pulse { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
    @keyframes rise {
      0% { opacity: 0; transform: translate(0,0) scale(.6); }
      20% { opacity: .45; }
      100% { opacity: 0; transform: translate(-14px,-48px) scale(1.8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .star, .win, .smoke { animation: none; }
      .star { opacity: .8; }
    }
  </style>

  <!-- sky -->
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="930" cy="70" r="70" fill="url(#moon)"/>
  <circle cx="930" cy="70" r="24" fill="#f6f1d8"/>

  <!-- stars -->
  <g>
    <circle class="star" cx="640" cy="40" r="1.6"/>
    <circle class="star s2" cx="720" cy="90" r="1.3"/>
    <circle class="star s3" cx="790" cy="30" r="1.8"/>
    <circle class="star" cx="1040" cy="48" r="1.4"/>
    <circle class="star s2" cx="1110" cy="100" r="1.6"/>
    <circle class="star s3" cx="860" cy="120" r="1.2"/>
    <circle class="star" cx="1160" cy="30" r="1.3"/>
    <circle class="star s2" cx="580" cy="110" r="1.2"/>
  </g>

  <!-- far mountains -->
  <path d="M0 230 L120 160 L210 205 L330 130 L450 210 L560 165 L690 215 L800 150 L930 210 L1050 160 L1200 220 L1200 320 L0 320 Z" fill="#1c4338" opacity="0.85"/>
  <!-- near hills -->
  <path d="M0 262 Q180 215 360 250 T720 248 T1080 244 T1200 255 L1200 320 L0 320 Z" fill="#12302a"/>

  <!-- far pines -->
  <g fill="#18382f" opacity="0.9">
    <use href="#pine" x="610" y="170" width="34" height="68"/>
    <use href="#pine" x="650" y="180" width="28" height="56"/>
    <use href="#pine" x="1060" y="172" width="34" height="68"/>
    <use href="#pine" x="1100" y="182" width="28" height="56"/>
  </g>

  <!-- cabin glow -->
  <ellipse cx="850" cy="248" rx="120" ry="60" fill="url(#glow)" class="win"/>

  <!-- cabin -->
  <g>
    <rect x="808" y="224" width="84" height="46" fill="#4a3426"/>
    <polygon points="798,226 850,190 902,226" fill="#2a1d16"/>
    <rect x="876" y="196" width="10" height="22" fill="#33261d"/>
    <rect x="838" y="238" width="14" height="32" fill="#2a1d16"/>
    <rect class="win" x="815" y="234" width="18" height="16" fill="#ffc66d"/>
    <rect class="win" x="867" y="234" width="18" height="16" fill="#ffc66d"/>
    <path d="M824 234 V250 M815 242 H833 M876 234 V250 M867 242 H885" stroke="#4a3426" stroke-width="1.5"/>
    <!-- chimney smoke -->
    <circle class="smoke" cx="881" cy="192" r="5"/>
    <circle class="smoke sm2" cx="881" cy="192" r="5"/>
    <circle class="smoke sm3" cx="881" cy="192" r="5"/>
  </g>

  <!-- foreground pines -->
  <g fill="#0a1f1a">
    <use href="#pine" x="740" y="176" width="52" height="104"/>
    <use href="#pine" x="925" y="168" width="60" height="120"/>
    <use href="#pine" x="985" y="186" width="46" height="92"/>
    <use href="#pine" x="1150" y="160" width="64" height="128"/>
    <use href="#pine" x="690" y="196" width="40" height="80"/>
  </g>

  <!-- ground + mist -->
  <path d="M0 286 Q300 262 600 282 T1200 276 L1200 320 L0 320 Z" fill="#081814"/>
  <rect y="230" width="1200" height="90" fill="url(#mist)"/>

  <!-- left darkening so text stays readable -->
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#081814" stop-opacity="0.55"/>
    <stop offset="0.55" stop-color="#081814" stop-opacity="0"/>
  </linearGradient>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <!-- text -->
  <text class="code" x="64" y="82">// building quietly, shipping often</text>
  <text class="name" x="62" y="150">Kavy Soni</text>
  <text class="role" x="64" y="192">Python  |  React.js  |  Full-Stack Developer</text>
  <text class="code" x="64" y="232">const status = "open to opportunities";</text>
</svg>
